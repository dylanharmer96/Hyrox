<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyrox">
<meta name="theme-color" content="#080808">
<title>Hyrox Training Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --volt: #C8F000;
    --volt-glow: rgba(200,240,0,0.22);
    --volt-faint: rgba(200,240,0,0.07);
    --teal: #00C8A0;
    --teal-glow: rgba(0,200,160,0.18);
    --teal-faint: rgba(0,200,160,0.06);
    --white: #edeae4;
    --ink: #080808;
    --ink2: #101010;
    --ink3: #181818;
    --muted: #505050;
    --muted2: #3a3a3a;
    --border: rgba(255,255,255,0.055);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--ink); color: var(--white); font-family: 'Barlow', sans-serif; font-weight: 300; overscroll-behavior: none; }

  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: repeating-linear-gradient(180deg, transparent 0px, transparent 79px, rgba(255,255,255,0.02) 79px, rgba(255,255,255,0.02) 80px);
  }

  .app { position: relative; z-index: 2; min-height: 100vh; min-height: -webkit-fill-available; padding-top: calc(var(--safe-top) + 0px); padding-bottom: calc(var(--safe-bottom) + 72px); }

  .hero {
    position: relative; padding: calc(var(--safe-top) + 20px) 20px 22px;
    border-bottom: 1px solid var(--border); overflow: hidden; min-height: 140px;
  }

  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center 40%;
    filter: brightness(0.18) saturate(0.6); z-index: 0;
  }
  .hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,8,8,0.1) 0%, rgba(8,8,8,0.85) 100%);
  }
  .hero-top, .hero-sub { position: relative; z-index: 1; }
  .hero::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, var(--volt), transparent 50%); opacity: 0.6; z-index: 2;
  }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .wordmark { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 44px; letter-spacing: -0.02em; text-transform: uppercase; color: var(--white); line-height: 0.9; }
  .wordmark .hl { color: var(--volt); }
  .reborn-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; border: 1px solid var(--muted2); border-radius: 1px; margin-top: 4px; }
  .hero-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

  .progress-wrap { padding: 13px 20px; border-bottom: 1px solid var(--border); background: var(--ink2); }
  .progress-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .progress-pct { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; color: var(--volt); letter-spacing: -0.03em; }
  .track { height: 2px; background: var(--muted2); position: relative; }
  .fill { height: 100%; background: var(--volt); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); position: relative; box-shadow: 0 0 6px var(--volt-glow); }
  .fill::after { content: ''; position: absolute; right: -5px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 12px var(--volt); }

  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
  .stat { background: var(--ink); padding: 10px 12px; text-align: center; }
  .stat-val { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; color: var(--white); display: block; letter-spacing: -0.02em; }
  .stat-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 1px; }

  .phase-tabs { display: flex; gap: 6px; padding: 11px 20px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); background: var(--ink2); }
  .phase-tabs::-webkit-scrollbar { display: none; }
  .ptab { flex-shrink: 0; padding: 5px 11px; border-radius: 1px; border: 1px solid var(--muted2); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); cursor: pointer; background: transparent; transition: all 0.15s; }
  .ptab.ap1, .ptab.ap3 { border-color: var(--volt); color: var(--volt); background: var(--volt-faint); }
  .ptab.ap2 { border-color: var(--teal); color: var(--teal); background: var(--teal-faint); }

  .week-scroller { display: flex; gap: 7px; padding: 11px 20px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
  .week-scroller::-webkit-scrollbar { display: none; }
  .wbtn { flex-shrink: 0; width: 38px; height: 38px; border-radius: 2px; border: 1px solid var(--muted2); background: transparent; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; color: var(--muted); cursor: pointer; position: relative; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .wbtn.p1, .wbtn.p3 { border-color: rgba(200,240,0,0.2); }
  .wbtn.p2 { border-color: rgba(0,200,160,0.2); }
  .wbtn.aw.p1, .wbtn.aw.p3 { background: var(--volt); border-color: var(--volt); color: #000; box-shadow: 0 0 14px var(--volt-glow); }
  .wbtn.aw.p2 { background: var(--teal); border-color: var(--teal); color: #000; box-shadow: 0 0 14px var(--teal-glow); }
  .done-pip { position: absolute; bottom: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--volt); border: 2px solid var(--ink); }

  .week-head { padding: 13px 20px 7px; display: flex; align-items: center; justify-content: space-between; }
  .week-title { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; color: var(--white); }
  .week-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 9px; border-radius: 1px; }
  .wb-p1, .wb-p3 { background: var(--volt-faint); color: var(--volt); border: 1px solid rgba(200,240,0,0.28); }
  .wb-p2 { background: var(--teal-faint); color: var(--teal); border: 1px solid rgba(0,200,160,0.28); }

  .phase-focus { margin: 0 20px 11px; padding: 9px 11px; background: var(--ink3); border-left: 2px solid var(--volt); font-size: 12px; font-weight: 300; color: var(--muted); line-height: 1.65; }
  .phase-focus.p2 { border-left-color: var(--teal); }

  .sessions { padding: 0 20px; display: flex; flex-direction: column; gap: 6px; }

  .card { background: var(--ink2); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; transition: border-color 0.2s; }
  .card.done { border-color: rgba(200,240,0,0.28); background: rgba(200,240,0,0.025); }

  .card-head { display: flex; align-items: center; gap: 8px; padding: 11px 11px; cursor: pointer; user-select: none; }

  .day-pill { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; border-radius: 1px; min-width: 70px; text-align: center; flex-shrink: 0; }
  .d-mon { background: rgba(160,100,200,0.07); color: #a064c8; border: 1px solid rgba(160,100,200,0.2); }
  .d-away { background: rgba(200,120,0,0.08); color: #C87800; border: 1px solid rgba(200,120,0,0.25); }
  .tt-away { background: rgba(200,120,0,0.08); color: #C87800; border: 1px solid rgba(200,120,0,0.2); }
  .d-tue { background: var(--volt-faint); color: var(--volt); border: 1px solid rgba(200,240,0,0.2); }
  .d-wed { background: var(--teal-faint); color: var(--teal); border: 1px solid rgba(0,200,160,0.2); }
  .d-thu { background: rgba(200,160,0,0.07); color: #C8A000; border: 1px solid rgba(200,160,0,0.18); }
  .d-fri { background: var(--teal-faint); color: #5a9888; border: 1px solid rgba(0,200,160,0.12); }
  .d-sat { background: rgba(160,160,160,0.05); color: #666; border: 1px solid rgba(160,160,160,0.12); }
  .d-sun { background: rgba(200,240,0,0.04); color: #8a9e20; border: 1px solid rgba(200,240,0,0.12); }

  .card-title { flex: 1; font-size: 13px; font-weight: 500; color: var(--white); line-height: 1.3; }

  .type-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border-radius: 1px; flex-shrink: 0; }
  .tt-run { background: var(--volt-faint); color: var(--volt); }
  .tt-z2 { background: var(--teal-faint); color: var(--teal); }
  .tt-strength { background: rgba(160,160,160,0.05); color: #555; border: 1px solid rgba(160,160,160,0.1); }
  .tt-sim { background: rgba(200,240,0,0.05); color: #8a9e20; }
  .tt-hyrox { background: rgba(200,160,0,0.07); color: #C8A000; }
  .tt-weak { background: var(--volt-faint); color: var(--volt); border: 1px solid rgba(200,240,0,0.28); }

  .chk { width: 26px; height: 26px; border-radius: 2px; border: 1px solid var(--muted2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; color: transparent; font-size: 13px; font-weight: 900; font-family: 'Barlow Condensed', sans-serif; }
  .chk.on { background: var(--volt); border-color: var(--volt); color: #000; box-shadow: 0 0 8px var(--volt-glow); }

  .chevron { font-size: 9px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }

  .card-body { border-top: 1px solid var(--border); padding: 11px 11px 13px; }
  .session-detail { font-size: 12px; font-weight: 300; color: #777; line-height: 1.9; white-space: pre-line; }
  .coach-note { margin-top: 10px; padding: 8px 10px; background: rgba(200,240,0,0.04); border-left: 2px solid var(--volt); font-size: 11px; font-weight: 400; color: #7a8e18; line-height: 1.65; }
  .coach-note strong { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--volt); display: block; margin-bottom: 3px; }

  .feedback-section { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .feedback-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
  .rating-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .rating-btn { flex: 1; height: 30px; border-radius: 2px; border: 1px solid var(--muted2); background: transparent; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .rating-btn.sel { background: var(--volt); border-color: var(--volt); color: #000; box-shadow: 0 0 8px var(--volt-glow); }
  .feedback-textarea { width: 100%; background: var(--ink3); border: 1px solid var(--muted2); border-radius: 2px; color: var(--white); font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 300; line-height: 1.6; padding: 9px 10px; resize: none; min-height: 80px; outline: none; margin-bottom: 10px; }
  .feedback-textarea::placeholder { color: var(--muted); }
  .feedback-textarea:focus { border-color: rgba(200,240,0,0.4); }
  .save-feedback-btn { width: 100%; padding: 9px; background: transparent; border: 1px solid var(--volt); border-radius: 2px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--volt); cursor: pointer; transition: all 0.15s; margin-bottom: 10px; }
  .save-feedback-btn:active { background: var(--volt-faint); }
  .ai-btn { width: 100%; padding: 9px; background: var(--volt); border: none; border-radius: 2px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #000; cursor: pointer; transition: all 0.15s; }
  .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ai-btn:active { opacity: 0.85; }
  .ai-response { margin-top: 10px; padding: 10px 11px; background: rgba(200,240,0,0.04); border-left: 2px solid var(--volt); font-size: 12px; font-weight: 300; color: #aaa; line-height: 1.8; white-space: pre-wrap; }
  .ai-response strong { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--volt); display: block; margin-bottom: 5px; }
  .ai-thinking { color: var(--muted); font-style: italic; font-size: 11px; }
  .saved-rating { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px; }
  .saved-rating-num { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; color: var(--volt); }
  .saved-rating-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .row-photo-wrap {
    position: relative; overflow: hidden; height: 100px;
    margin: 6px 20px; border-radius: 2px; border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .row-photo-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: center 20%; filter: brightness(0.28) saturate(0.5);
    display: block;
  }
  .row-photo-wrap::after {
    content: 'REBORN ATHLETIC'; position: absolute; bottom: 8px; left: 10px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--volt); opacity: 0.6;
  }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(52px + var(--safe-bottom)); background: rgba(8,8,8,0.97); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: center; padding-top: 13px; }
  .nav-word { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .nav-x { color: var(--volt); margin: 0 10px; font-size: 13px; line-height: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; }

  @keyframes cardIn { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
  .sessions .card { animation: cardIn 0.18s ease both; }
  .sessions .card:nth-child(2) { animation-delay:0.04s; }
  .sessions .card:nth-child(3) { animation-delay:0.08s; }
  .sessions .card:nth-child(4) { animation-delay:0.12s; }
  .sessions .card:nth-child(5) { animation-delay:0.16s; }
  .sessions .card:nth-child(6) { animation-delay:0.20s; }
</style>
</head>

<script>
const WEEKS=[
  {phase:1,focus:"Aerobic fitness base + muscle strength. Moving through reps at zone 2/3 HR. Light threshold running introduced.",sessions:[
    {day:"Monday",tag:"z2",label:"Erg — easy row",detail:"40 min continuous row @ easy aerobic pace.\nTarget: 2:15–2:25/500m — fully zone 2.\n\nTechnique focus throughout:\nLegs drive first, then lean, then pull.\nRelax hands and shoulders on the recovery.\nBreathing fully controlled the whole time.\n\nThis is active recovery — not a training stimulus. Treat it like a walk with a purpose.",note:"Zero pressure session. Your job is to move blood through the legs and keep the aerobic system ticking. If it feels too easy, that's correct."},
    {day:"Tuesday",tag:"run",label:"Intervals",detail:"1.5km warm-up\n6 × 700m @ 3:55–4:00/km — 90s walk recovery\n1km cool-down",note:null},
    {day:"Wednesday",tag:"z2",label:"Zone 2 run",detail:"60 min easy zone 2 pace\nKeep HR controlled throughout",note:null},
    {day:"Thursday",tag:"hyrox",label:"Sled + run combos",detail:"5 rounds:\n500m run → 40m sled push 150kg → 300m run → 20m sled push 150kg\n1 min assault bike easy pace between rounds\n\nFinisher (after all 5 rounds):\nDB alternating snatches 3×8 each arm @ 20kg\n\nTotal ~55 min.",note:"Sled push focus — stay low, drive from glutes. Note your time each round. Snatches: same explosive hip drive as the sled — reinforces the pattern while it's fresh."},
    {day:"Friday",tag:"z2",label:"Zone 2 run",detail:"70 min easy zone 2 pace",note:null},
    {day:"Saturday",tag:"strength",label:"Strength",detail:"Trap bar deadlift 4×5\nIncline bench 4×7\nBarbell squats 4×6\nReverse lunges 3×20 @ 20kg\nRDL 3×7\nChest supported row 3×8\nPush-ups 3×15\nDB alternating snatches 3×8 each arm\nPull-ups 3×10\nHanging knee raises 3×12\n20 min C2 bike easy",note:"DB snatches: explosive hip drive from floor to overhead — directly trains the power you need for sled push drive-off."},
    {day:"Sunday",tag:"sim",label:"The Long Loop — 7 rounds",detail:"~70 min. No rest unless needed. Zone 2–3 effort throughout.\n\n7 rounds:\n400m run\n200m ski erg\n200m row\n20m sled push 100kg\n20m sled pull 100kg\n10 wall balls 9kg\n\nOnce all 7 rounds are done, go straight into the finisher:\n\nFinisher — 3 rounds:\n20 KB swings @ 20kg\n15 DB thrusters @ 12.5kg each\n10 burpee broad jumps\n\nLight load, high volume throughout. The goal is continuous movement. By round 5 your HR will be sitting high — the finisher is the gut check.",note:"First real exposure to sustained time under fatigue. Don't go hard on the main rounds — go steady. The finisher is where you push. Notice where form breaks down and remember it."},
  ]},
  {phase:1,focus:"Aerobic base building. Introduce wall balls into combos. Strength session adds lunges for BBJ carry-over.",sessions:[
    {day:"Monday",tag:"z2",label:"Long slow row",detail:"45–60 min continuous row @ easy pace.\nTarget: 2:10–2:20/500m — this is zone 2 on the erg.\n\nFocus on technique throughout:\nDrive legs first, lean back slightly, pull to lower chest.\nRelax the hands on the recovery.\nBreathing should be fully controlled — if you can't hold a conversation you're going too hard.\n\nOptional: swap for ski erg if rower is taken. Same duration, same effort.",note:"Pure aerobic base work. Your legs are still fresh from the weekend so this is a free aerobic session with zero impact. Builds your erg engine without touching your running or Hyrox capacity."},
    {day:"Tuesday",tag:"run",label:"Intervals",detail:"1.5km warm-up\n5 × 800m @ 3:55/km — 90s jog recovery\n1km cool-down",note:null},
    {day:"Wednesday",tag:"z2",label:"Zone 2 run",detail:"60 min easy zone 2 pace",note:null},
    {day:"Thursday",tag:"hyrox",label:"Run / sled / wall balls",detail:"5 rounds:\n600m run @ 4:00/km → 50m sled push 150kg → 400m run @ 4:00/km → 20 wall balls 9kg\n60s rest between rounds\n\nFinisher:\nKB swings 3×20 @ 24kg\n\nTotal ~65 min.",note:"Wall balls — drive through hips, full depth squat. Aim to hold sets unbroken. KB swings after: posterior chain flush while it's fatigued — builds the same hip hinge endurance you need for BBJ."},
    {day:"Friday",tag:"z2",label:"Zone 2 run",detail:"70 min easy zone 2 pace",note:null},
    {day:"Saturday",tag:"away",label:"Brisbane — Bodyweight circuit",detail:"NO GYM. Bodyweight substitute for strength session.\n\n4 rounds — no rest between movements, 90s between rounds:\n20 burpees\n40 walking lunges (bodyweight)\n20 push-ups\n15 jump squats\n20 hip thrusts (on floor)\n\nTotal ~35–40 min.\n\nDo it outside if possible. Burpees and lunges are your two most relevant Hyrox movements — this hits both.",note:"No equipment needed. Burpees directly substitute BBJ mechanics. Lunges keep the posterior chain firing. Keep it moving — treat it like a mini sim."},
    {day:"Sunday",tag:"away",label:"Brisbane — Easy zone 2 run",detail:"NO GYM. Aerobic substitute for Sunday sim.\n\n50–60 min easy zone 2 run.\nBrisbane Riverwalk or South Bank — flat, scenic, measured paths.\n\nKeep HR under 140bpm the whole time.\nIf legs are tired from yesterday, cut to 40 min.",note:"Zone 2 run is the best no-equipment Sunday substitute. Keeps aerobic base ticking without needing any stations or equipment. Enjoy Brisbane."},
  ]},
  {phase:1,focus:"Aerobic base + longer intervals. Lunge volume up. BBJ mechanics in sim.",sessions:[
    {day:"Monday",tag:"z2",label:"Erg — ski erg easy",detail:"40 min continuous ski erg @ easy aerobic pace.\nTarget: 2:20–2:30/500m — fully zone 2.\n\nFocus on the pull pattern:\nHinge from hips, arms pull to chest height, control the return.\nDon't rush the stroke — long and smooth over short and choppy.\n\nActive recovery. Legs get a rest, upper body and pulling muscles stay engaged.",note:"Ski erg zone 2 is low impact on the legs which is perfect mid-week. Great for sled pull muscle recovery and maintenance."},

    {day:"Sunday",tag:"sim",label:"The Engine Builder",detail:"~65 min. Pure aerobic engine work — machines and running only.\n\n1000m row @ easy pace\n1000m ski erg @ easy pace\n1km run @ 4:30/km\n800m row\n800m ski erg\n1km run @ 4:20/km\n600m row\n600m ski erg\n1km run @ 4:10/km\n400m row\n400m ski erg\n1km run @ 4:00/km\n\nNo breaks. Continuous with a negative split on every run.",note:"The machines keep HR elevated so each run starts with legs already heavy. By the final 1km you'll know exactly what race-day running fatigue feels like."},

  {phase:1,focus:"Phase 1 capstone. All four weaknesses in one combo. Light deload on Saturday.",sessions:[

    {day:"Tuesday",tag:"away",label:"Blue Mtns — Easy trail run",detail:"NO GYM. Easy trail or road run.\n\n45 min easy zone 2 run in the Blue Mountains.\nKeep HR under 140bpm — slow down on the hills, time on feet matters more than pace.\n\nDo not attempt intervals on unfamiliar trail terrain.",note:"Trail running at easy effort is excellent cross-training. The uneven surface works stabilisers without adding load. Enjoy the scenery."},

    {day:"Thursday",tag:"away",label:"UTA 11km — Blue Mountains",detail:"UTA BLUE MOUNTAINS TRAIL RUN — 11KM.\n\nThis IS your Thursday session for the week. Treat it like one.\n\nRace effort: strong and controlled — not a sprint, not a jog. Think threshold running on terrain. The elevation will make it significantly harder than flat road at the same pace.\n\nEnjoy every metre of it.",note:"Elevation + trail surface + race environment = excellent aerobic and running resilience stimulus. This fully replaces the Thursday Hyrox session. No guilt about missing the gym."},
    {day:"Friday",tag:"away",label:"Blue Mtns — Active recovery",detail:"NO GYM. Active recovery only.\n\n30–40 min very easy walk or gentle jog.\nLegs will be cooked after Thursday — don't push anything.\n\nStretch focus: hip flexors, calves, thoracic rotation.\nHydrate well and eat enough to recover.",note:"Keep moving but keep it easy. Blood flow only — not a training session."},
    {day:"Saturday",tag:"away",label:"Blue Mtns — Rest + mobility",detail:"NO GYM. Full rest or light mobility only.\n\nOption A: Full rest.\nOption B: 20 min easy walk + mobility work.\n\nHip flexors, calves, thoracic, ankles.\nNo loading whatsoever. Come back fresh for week 5.",note:"Coach called this a recovery week for good reason. The trail run was the work. Let the body absorb it and arrive at week 5 ready to build."},
    {day:"Sunday",tag:"sim",label:"All 8 stations — race order",detail:"~70 min. Every Hyrox movement once in race order at aerobic effort. No running between stations this week — pure station sequence.\n\n1000m ski erg\n50m sled push 140kg\n50m sled pull 100kg\n80m burpee broad jumps\n1000m row\n200m farmer carry 2×16kg KB\n100m sandbag lunges 10kg bag\n100 wall balls 9kg\n\nMove straight from one to the next. Rest 60–90s only if form is breaking down.",note:"Phase 1 capstone. The point isn't to go fast — it's to survive with good form. Note which stations spike your HR the most. That's your data."},

  {phase:2,focus:"Threshold work introduced. Higher HR comfort. Maintain aerobic base. Volume up on sleds, lunges, weighted movements.",sessions:[

    {day:"Thursday",tag:"hyrox",label:"Row / sled pull / lunges",detail:"6 rounds:\n1km row @ sub 2:00/500m → 20m sled pull 150kg → 30m walking lunges 12.5kg DB\n90s rest\n\nFinisher:\nSandbag cleans 3×8 @ 20kg\n\nTotal ~65 min.",note:"Sandbag cleans: trains the explosive pull and catch pattern — directly carries over to sled pull mechanics and the farmer carry pickup. Do them controlled; the load off the floor mimics sled pull start position."},
    {day:"Friday",tag:"z2",label:"Zone 2 run",detail:"10km zone 2 pace",note:null},
    {day:"Saturday",tag:"strength",label:"Strength",detail:"Trap bar deadlift 4×5\nIncline bench 4×7\nFront squats 4×6\nReverse lunges 3×20 @ 20kg\nRDL 3×7\nChest supported row 3×8\nPush-ups 3×15\nDevils press 3×8 @ 15kg DBs\nPull-ups 4×6\nHanging knee raises 3×12\n20 min C2 bike easy",note:"Devils press: burpee + snatch combo. Directly trains the full-body coordination and shoulder endurance you need to survive BBJ at high HR. Go controlled."},
    {day:"Sunday",tag:"sim",label:"Benchmarks + run-station-run blocks",detail:"~90 min total.\n\nPart 1 — Benchmarks (record everything — these are your week 5 baseline):\nTest 1: 100m sled push 150kg for time\nRest 4 min\nTest 2: 100–120 wall balls 9kg for time\nRest 4 min\nTest 3: 1km run @ best effort pace\nRest 5 min\n\nWrite these times down. You'll be retesting them in week 8 to measure exactly how much phase 2 has improved you.\n\nPart 2 — Run-station-run blocks, 5 rounds:\nEach round = run, one station, run. 2 min rest between rounds.\n\nRound 1: 1km run @ 4:00/km → 1000m row @ 2:00/500m → 1km run @ 4:00/km\nRound 2: 1km run @ 4:00/km → 30 wall balls 9kg → 1km run @ 4:00/km\nRound 3: 1km run @ 4:00/km → 40m burpee broad jumps → 1km run @ 4:00/km\nRound 4: 1km run @ 4:00/km → 200m farmer carry 2×20kg KB → 1km run @ 4:00/km\nRound 5: 1km run @ 4:00/km → 20m sled pull 150kg → 1km run @ 4:00/km\n\nFinisher — 3 rounds:\n20m sandbag lunges 10kg bag\n12 devils press @ 12.5kg DBs\n500m ski erg\n\n90s rest between finisher rounds.",note:"Benchmarks are done first while completely fresh — that's the only way the data is valid. Record all three times somewhere permanent. The run-station rounds and finisher are the real session volume. Sled push is removed from the rounds since you've already maxed it in the benchmark."},

    {day:"Sunday",tag:"sim",label:"The Grinder — AMRAP 65 min + finisher",detail:"~80 min total. As many rounds as possible in 65 minutes. No stopping mid-station.\n\nEach round:\n600m run\n500m row\n20m sled push 150kg\n20 wall balls 9kg\n20m burpee broad jumps\n200m farmer carry 2×16kg KB\n\nA strong effort yields 5–6 complete rounds. Don't sprint — find a rhythm you can sustain.\n\nWhen the 65 min cap hits, go straight into the finisher:\n\nFinisher — 3 rounds:\n15 DB thrusters @ 15kg each\n10 devils press @ 12.5kg DBs\n300m row\n\n60s rest between finisher rounds. Total finisher ~12–15 min.",note:"The AMRAP is extended to 65 min — more rounds means more race-specific fatigue. The finisher is non-negotiable even when you're spent. Thrusters and devils press under that level of fatigue is exactly what separates you from where you were in Brisbane."},

    {day:"Sunday",tag:"sim",label:"Death by distance + gut-check finisher",detail:"~80 min. Rounds get longer. Early rounds are easy — the back half is where the work happens.\n\nRound 1: 400m run → 500m row → 20m sled push 180kg\nRound 2: 600m run → 600m row → 30m sled push 180kg\nRound 3: 800m run → 750m row → 40m sled push 180kg\nRound 4: 1km run → 1000m row → 50m sled push 180kg\n2 min rest between rounds.\n\nFinisher — 5 rounds for time:\n10 wall balls 9kg\n10 burpee broad jumps\n10 DB alternating snatches @ 20kg\n200m ski erg\n\n45s rest between finisher rounds.\n\nNo skipping the finisher. This is the session where you find out what you're made of when the legs are already gone.",note:"Peak volume week. Round 4 sled at 180kg will be the hardest 50m of the block so far. The finisher is designed to be done on empty — wall balls, BBJ, snatches, and ski all in sequence. That full-body coordination under maximum fatigue is exactly what you need to hold form late in a race."},

let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('hyrox_db',2);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=()=>rej();
  });
}

function dbGet(key){
  return new Promise((res)=>{
    if(!db){res(null);return;}
    const tx=db.transaction('kv','readonly');
    const req=tx.objectStore('kv').get(key);
    req.onsuccess=()=>res(req.result||null);
    req.onerror=()=>res(null);
  });
}

function dbSet(key,val){
  return new Promise((res)=>{
    if(!db){res();return;}
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val,key);
    tx.oncomplete=()=>res();
    tx.onerror=()=>res();
  });
}

function save(){
  const d1=JSON.stringify(completed);
  const d2=JSON.stringify(feedback);
  const d3=JSON.stringify(aiResponses);
  dbSet('hyrox_v3',d1);dbSet('hyrox_fb',d2);dbSet('hyrox_ai',d3);
  try{localStorage.setItem('hyrox_v3',d1);localStorage.setItem('hyrox_fb',d2);localStorage.setItem('hyrox_ai',d3);}catch(e){}
}

async function loadAndStart(){
  try{
    await openDB();
    const[d1,d2,d3]=await Promise.all([dbGet('hyrox_v3'),dbGet('hyrox_fb'),dbGet('hyrox_ai')]);
    const fb=(k)=>{try{return localStorage.getItem(k);}catch(e){return null;}};
    const s1=d1||fb('hyrox_v3');if(s1)try{completed=JSON.parse(s1);}catch(e){}
    const s2=d2||fb('hyrox_fb');if(s2)try{feedback=JSON.parse(s2);}catch(e){}
    const s3=d3||fb('hyrox_ai');if(s3)try{aiResponses=JSON.parse(s3);}catch(e){}
  }catch(e){
    try{
      const s1=localStorage.getItem('hyrox_v3');if(s1)completed=JSON.parse(s1);
      const s2=localStorage.getItem('hyrox_fb');if(s2)feedback=JSON.parse(s2);
      const s3=localStorage.getItem('hyrox_ai');if(s3)aiResponses=JSON.parse(s3);
    }catch(e2){}
  }
  render();
}

function totalSessions(){return WEEKS.reduce((t,w)=>t+w.sessions.length,0);}
function doneCount(){return Object.values(completed).filter(Boolean).length;}
function weekDone(wi){return WEEKS[wi].sessions.filter((_,si)=>completed[`${wi}_${si}`]).length;}
function allDone(wi){return weekDone(wi)===WEEKS[wi].sessions.length;}

function setRating(key,r){
  if(!feedback[key])feedback[key]={};
  feedback[key].rating=r;
  save();render();
}

function saveFeedbackText(key){
  const ta=document.getElementById('ta_'+key);
  if(!ta)return;
  if(!feedback[key])feedback[key]={};
  feedback[key].text=ta.value;
  save();
  const btn=document.getElementById('sfb_'+key);
  if(btn){btn.textContent='Saved ✓';btn.style.color='var(--volt)';setTimeout(()=>{if(btn){btn.textContent='Save notes';btn.style.color='';}},1500);}
}

function detectKeywords(notes){
  const n = notes.toLowerCase();
  const found = {};
  for(const [cat, words] of Object.entries(KEYWORDS)){
    found[cat] = words.some(w => n.includes(w));
  }
  return found;
}

function getRatingBand(r){
  if(r >= 9) return 'elite';
  if(r >= 7) return 'solid';
  if(r >= 5) return 'mid';
  if(r >= 3) return 'low';

}

function getCoachingResponse(sessionTag, rating, notes){
  const band = getRatingBand(rating);
  const kw = detectKeywords(notes);
  
  // Get the response library for this session type
  const lib = RESPONSES[sessionTag] || RESPONSES.hyrox;
  const bandLib = lib[band] || lib.mid;
  
  // Priority order of keyword matches — most specific first
  const priorityOrder = [
    'knee','groin','back',           // injury first
    'cut_short',                      // didn't complete
    'nutrition','hydration',          // fuelling
    'sled','wallballs','bbj','row','ski','lunges', // specific stations
    'form_bad','form_good',           // technique
    'hr_high','hr_good',              // cardio
    'fast_pace','slow_pace','good_time', // pace
    'mental_bad','mental_good',       // mental
    'tired','fresh',                  // energy
    'legs_heavy','legs_good',         // legs
    'sore','recovery_good',           // recovery
    'completed_all',                  // volume
    'heat','cold',                    // environment
  ];
  
  for(const kwKey of priorityOrder){
    if(kw[kwKey] && bandLib[kwKey]){
      return bandLib[kwKey];
    }
  }
  
  // Fallback to default for this band
  if(bandLib.default) return bandLib.default;
  
  // Ultimate fallback
  const fallbacks = {
    elite:"Outstanding session. The fitness is clearly there. Push a little harder next time — you've earned the right to test your ceiling.",
    solid:"Good solid session. Consistency is the game and you're playing it well. Keep showing up.",
    mid:"Average session — it happens. Identify one specific thing to fix and focus only on that next time. Don't try to change everything at once.",
    low:"Tough session. Rest up, eat well, sleep, and treat the next session as a fresh start. One bad session means nothing.",
    poor:"Write this one off and reset. Rest, recover, come back ready."
  };
  return fallbacks[band];
}

function getAIResponse(key, weekIdx, sessionIdx){
  const s = WEEKS[weekIdx].sessions[sessionIdx];
  const fb = feedback[key] || {};
  const rating = fb.rating || 5;
  const notes = (fb.text || '').trim();
  const btn = document.getElementById('aibtn_' + key);
  const resDiv = document.getElementById('aires_' + key);

  if(!fb.rating && !notes){
    if(resDiv){
      resDiv.style.display = 'block';
      resDiv.innerHTML = '<span class="ai-thinking">Add a rating and some notes first, then get your coaching response.</span>';
    }
    return;
  }

  const response = getCoachingResponse(s.tag, rating, notes);
  const timestamp = new Date().toLocaleDateString('en-AU', {day:'numeric', month:'short'});

  if(!aiResponses[key]) aiResponses[key] = {};
  aiResponses[key].response = response;
  aiResponses[key].timestamp = timestamp;
  save();

  if(resDiv){
    resDiv.style.display = 'block';
    resDiv.innerHTML = `<strong>Coach · ${timestamp}</strong>${response}`;
  }
  if(btn) btn.textContent = 'Refresh response';
}

// ─────────────────────────────────────────────────────────────────────────────

function render(){
  const w=WEEKS[cw],pm=PM[w.phase];
  const total=totalSessions(),done=doneCount();
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('stats').innerHTML=`
    <div class="stat"><span class="stat-val">${done}/${total}</span><span class="stat-lbl">Sessions done</span></div>
    <div class="stat"><span class="stat-val">${weekDone(cw)}/${w.sessions.length}</span><span class="stat-lbl">This week</span></div>
    <div class="stat"><span class="stat-val">${cw+1}/10</span><span class="stat-lbl">Week</span></div>
  `;
  const pt=document.getElementById('phaseTabs');
  pt.innerHTML='';
  [[1,"Wks 1–4 · Foundation"],[2,"Wks 5–8 · Build"],[3,"Wks 9–10 · Race Prep"]].forEach(([p,lbl])=>{
    const b=document.createElement('button');
    b.className='ptab'+(w.phase===p?' '+PM[p].tabAct:'');
    b.textContent=lbl;b.onclick=()=>{const fi=WEEKS.findIndex(x=>x.phase===p);if(fi>=0){cw=fi;render();}};
    pt.appendChild(b);
  });
  const ws=document.getElementById('weekScroller');
  ws.innerHTML='';
  WEEKS.forEach((wk,i)=>{
    const b=document.createElement('button');
    b.className=`wbtn ${PM[wk.phase].wCls}${i===cw?' aw':''}`;
    b.textContent=i+1;b.onclick=()=>{cw=i;render();};
    if(allDone(i)){const d=document.createElement('span');d.className='done-pip';b.appendChild(d);}
    ws.appendChild(b);
  });
  document.getElementById('weekTitle').textContent=`Week ${cw+1}`;
  const wb=document.getElementById('weekBadge');
  wb.className='week-badge '+pm.wbCls;wb.textContent=pm.label;
  const pf=document.getElementById('phaseFocus');
  pf.className='phase-focus'+(pm.focusCls?' '+pm.focusCls:'');
  pf.textContent=w.focus;
  const sc=document.getElementById('sessions');
  sc.innerHTML='';
  w.sessions.forEach((s,si)=>{
    const key=`${cw}_${si}`,isDone=!!completed[key],isOpen=!!expanded[key],isWeak=!!s.note;
    const fb=feedback[key]||{};
    const ai=aiResponses[key]||{};
    const card=document.createElement('div');
    card.className='card'+(isDone?' done':'');
    const head=document.createElement('div');
    head.className='card-head';
    let ratingBadge='';
    if(fb.rating){
      const col=fb.rating>=8?'var(--volt)':fb.rating>=5?'#C8A000':'#E25050';
      ratingBadge=`<span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:${col};flex-shrink:0;">${fb.rating}</span>`;
    }
    head.innerHTML=`<span class="day-pill ${DAY_CLS[s.day]}">${s.day}</span><span class="card-title">${s.label}</span>${ratingBadge}<span class="type-tag ${isWeak?'tt-weak':TAG_CLS[s.tag]}">${isWeak?'Weakness':TAG_LBL[s.tag]}</span><span class="chevron${isOpen?' open':''}">▼</span>`;
    const chk=document.createElement('button');
    chk.className='chk'+(isDone?' on':'');
    chk.textContent=isDone?'✓':'';
    chk.onclick=(e)=>{e.stopPropagation();completed[key]=!completed[key];save();render();};
    head.appendChild(chk);
    head.onclick=(e)=>{if(e.target===chk||chk.contains(e.target))return;expanded[key]=!isOpen;render();};
    card.appendChild(head);
    if(isOpen){
      const body=document.createElement('div');
      body.className='card-body';
      body.innerHTML=`<div class="session-detail">${s.detail}</div>`;
      if(s.note){const n=document.createElement('div');n.className='coach-note';n.innerHTML=`<strong>Coach note</strong>${s.note}`;body.appendChild(n);}

      const fbSec=document.createElement('div');
      fbSec.className='feedback-section';

      const rLabel=document.createElement('span');
      rLabel.className='feedback-label';rLabel.textContent='Rate this session';
      fbSec.appendChild(rLabel);

      const rRow=document.createElement('div');
      rRow.className='rating-row';
      for(let r=1;r<=10;r++){
        const rb=document.createElement('button');
        rb.className='rating-btn'+(fb.rating===r?' sel':'');
        rb.textContent=r;
        rb.onclick=((_r,_k)=>()=>setRating(_k,_r))(r,key);
        rRow.appendChild(rb);
      }
      fbSec.appendChild(rRow);

      const nLabel=document.createElement('span');
      nLabel.className='feedback-label';nLabel.textContent='Session notes';
      fbSec.appendChild(nLabel);

      const ta=document.createElement('textarea');
      ta.className='feedback-textarea';ta.id='ta_'+key;
      ta.placeholder='What went well? What was hard? Any numbers — pace, sled time, round count, wall ball sets...';
      ta.value=fb.text||'';
      fbSec.appendChild(ta);

      const saveBtn=document.createElement('button');
      saveBtn.className='save-feedback-btn';saveBtn.id='sfb_'+key;
      saveBtn.textContent='Save notes';
      saveBtn.onclick=()=>saveFeedbackText(key);
      fbSec.appendChild(saveBtn);

      const aiBtn=document.createElement('button');
      aiBtn.className='ai-btn';aiBtn.id='aibtn_'+key;
      aiBtn.textContent=ai.response?'Refresh response':'Get coaching response';
      aiBtn.onclick=((_k,_wi,_si)=>()=>getAIResponse(_k,_wi,_si))(key,cw,si);
      fbSec.appendChild(aiBtn);

      const resDiv=document.createElement('div');
      resDiv.className='ai-response';resDiv.id='aires_'+key;
      if(ai.response){
        resDiv.innerHTML=`<strong>Coach · ${ai.timestamp||''}</strong>${ai.response}`;
      } else {
        resDiv.style.display='none';
      }
      fbSec.appendChild(resDiv);

      body.appendChild(fbSec);
      card.appendChild(body);
    }
    sc.appendChild(card);
  });
}


loadAndStart();
</script>
